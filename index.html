<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>CASE SO2 | Симулятор кейсов</title>
<style>
:root{--bg:#0d0f14;--p:#161a23;--p2:#1e2330;--t:#e6e9ef;--m:#8a93a6;--a:#ffb400}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% -20%,#232a3b,var(--bg) 60%) fixed;color:var(--t);font-family:Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 4vw;background:#0a0c10cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff10;flex-wrap:wrap;gap:10px}
.logo{font-weight:900;font-size:22px;letter-spacing:2px}.logo b{color:var(--a)}
nav{display:flex;gap:6px}
nav button,.btn{background:var(--p2);color:var(--t);border:1px solid #ffffff14;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:.2s}
nav button.on,nav button:hover,.btn:hover{background:var(--a);color:#111}
.bal{display:flex;align-items:center;gap:10px}
.gold{color:var(--a);font-weight:800;font-size:18px}
.bonus{background:linear-gradient(90deg,#ffb400,#ff7a00);color:#111;border:0}
.bonus:disabled{background:var(--p2);color:var(--m);cursor:default}
main{padding:28px 4vw;max-width:1300px;margin:auto}
h2{font-size:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.case{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid #ffffff10;border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.25s}
.case:hover{transform:translateY(-4px);border-color:var(--cc);box-shadow:0 10px 30px -10px var(--cc)}
.box{width:120px;height:90px;margin:6px auto 14px;border-radius:10px;background:linear-gradient(145deg,var(--cc),#000 140%);position:relative;box-shadow:inset 0 -8px 0 #0004,0 8px 20px #0008}
.box::before{content:'';position:absolute;left:0;right:0;top:34px;height:8px;background:#0005}
.box::after{content:'';position:absolute;left:50%;top:28px;width:22px;height:20px;margin-left:-11px;background:#ddd;border-radius:3px;box-shadow:inset 0 -4px #999}
.case h3{font-size:16px}
.price{color:var(--a);font-weight:800;margin-top:6px}
.item{background:linear-gradient(180deg,var(--p2),var(--p));border-radius:10px;padding:10px;border-bottom:3px solid var(--rc);position:relative;text-align:center;overflow:hidden}
.item::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--rc),transparent 65%);opacity:.18}
.item svg{width:100%;height:56px;position:relative}
.item .w{font-size:11px;color:var(--m);margin-top:4px;position:relative}
.item .s{font-size:13px;font-weight:700;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-size:12px;color:var(--a);position:relative;margin-top:2px}
.st{position:absolute;top:6px;left:6px;font-size:9px;background:#ff7a00;color:#111;padding:2px 5px;border-radius:4px;font-weight:800;z-index:1}
.chance{position:absolute;top:6px;right:6px;font-size:10px;color:var(--m);z-index:1}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.roul{position:relative;height:150px;background:#07080b;border-radius:14px;overflow:hidden;border:1px solid #ffffff12;margin-bottom:18px}
.strip{display:flex;gap:8px;position:absolute;top:12px;left:0;will-change:transform}
.strip .item{width:140px;flex:0 0 140px;height:126px}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--a);z-index:2;box-shadow:0 0 14px var(--a)}
.marker::before,.marker::after{content:'';position:absolute;left:-7px;border:8px solid transparent}
.marker::before{top:0;border-top-color:var(--a)}.marker::after{bottom:0;border-bottom-color:var(--a)}
.roul::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#07080b,transparent 20%,transparent 80%,#07080b);pointer-events:none;z-index:1}
.actions{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:30px}
.big{background:linear-gradient(90deg,#ffb400,#ff7a00);color:#111;border:0;padding:14px 34px;font-size:16px;border-radius:10px;font-weight:800;cursor:pointer}
.big:disabled{opacity:.4;cursor:not-allowed}
label{display:flex;align-items:center;gap:6px;color:var(--m);font-size:14px;cursor:pointer}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal.on{display:flex}
.win{background:var(--p);border-radius:18px;padding:30px;text-align:center;max-width:380px;width:100%;border:2px solid var(--rc);box-shadow:0 0 60px -10px var(--rc);animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.win svg{width:100%;height:110px;filter:drop-shadow(0 0 16px var(--rc))}
.win .r{color:var(--rc);font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:13px;margin-bottom:6px}
.win h3{font-size:22px}
.win .v{color:var(--a);font-size:20px;font-weight:800;margin:10px 0 20px}
.row{display:flex;gap:10px;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--p2);border-radius:12px;padding:16px}.stat b{display:block;font-size:20px;color:var(--a);margin-top:4px}.stat span{color:var(--m);font-size:13px}
.item .sell{position:relative;margin-top:8px;width:100%;padding:6px;font-size:12px}
.empty{color:var(--m);text-align:center;padding:60px 0;grid-column:1/-1}
footer{text-align:center;color:var(--m);font-size:12px;padding:30px}
.hide{display:none}
</style>
</head>
<body>
<header>
<div class='logo'>CASE<b>SO2</b></div>
<nav><button data-p='cases' class='on'>Кейсы</button><button data-p='inv'>Инвентарь</button><button data-p='stats'>Статистика</button></nav>
<div class='bal'><span class='gold' id='bal'>0 G</span><button class='btn bonus' id='bonus'>Бонус</button></div>
</header>
<main>
<section id='p-cases'><h2>Кейсы</h2><div class='grid' id='cases'></div></section>
<section id='p-open' class='hide'>
<div class='top'><button class='btn' id='back'>Назад</button><h2 id='cname' style='margin:0'></h2></div>
<div class='roul'><div class='marker'></div><div class='strip' id='strip'></div></div>
<div class='actions'><button class='big' id='openBtn'></button><label><input type='checkbox' id='fast'> Быстрое открытие</label></div>
<h2>Содержимое кейса</h2><div class='igrid' id='contents'></div>
</section>
<section id='p-inv' class='hide'>
<div class='top'><h2 style='margin:0'>Инвентарь</h2><span id='invSum' style='color:var(--m)'></span><button class='btn' id='sellAll'>Продать всё</button></div>
<div class='igrid' id='inv'></div>
</section>
<section id='p-stats' class='hide'><h2>Статистика</h2><div class='stats' id='stats'></div><button class='btn' id='reset'>Сбросить прогресс</button></section>
</main>
<div class='modal' id='modal'><div class='win' id='win'></div></div>
<footer>Фанатский симулятор. Не связан с Axlebolt и Standoff 2. Валюта виртуальная, реальных денег и предметов нет.</footer>
<script>
const R={common:{n:'Обычный',c:'#b0b7c3',w:45,m:6},uncommon:{n:'Необычный',c:'#5fb7ff',w:25,m:18},rare:{n:'Редкий',c:'#3d6bff',w:16,m:45},epic:{n:'Эпический',c:'#a44bff',w:9,m:130},legendary:{n:'Легендарный',c:'#ff3fa4',w:3.6,m:420},arcane:{n:'Тайный',c:'#ff3b3b',w:1.5,m:1400},gold:{n:'Нож',c:'#ffc83d',w:0.6,m:5000}};
const SH={rifle:'M4 18h62l4-5h36v7h-30l-3 4h-18l-5 13h-10l3-13h-12l-7 9h-14l5-10h-11z',sniper:'M2 20h36l4-5h76v4h-70l-4 5h-12l-7 11h-10l5-11h-18zM44 8h30v6h-30z',pistol:'M34 11h56v9h-38l-7 17h-13l6-17h-4z',smg:'M18 14h66v9h-32l-3 11h-9l3-11h-6l-4 13h-10l4-13h-9z',shotgun:'M2 17h78l4-3h32v6h-30l-3 4h-30l-6 12h-12l4-12h-10l-7 7h-16l6-9z',knife:'M6 21h36v7h-36zM42 18l72-9l-12 17h-60z'};
const S=[['G22','pistol','Grid','common'],['USP','pistol','Stone Cold','common'],['P350','pistol','Forest','common'],['UMP45','smg','Cyberpunk','common'],['SM1014','shotgun','Sand','common'],['MP7','smg','Urban','uncommon'],['TEC-9','pistol','Tie Dye','uncommon'],['FAMAS','rifle','Hull','uncommon'],['P90','smg','Ghoul','uncommon'],['M40','sniper','Grip','rare'],['Desert Eagle','pistol','Red Dragon','rare'],['M4','rifle','Pixel Camo','rare'],['AKR12','rifle','Carbon','rare'],['FN FAL','rifle','Tactical','epic'],['AKR','rifle','Necromancer','epic'],['AWM','sniper','Sport V2','epic'],['M4','rifle','Samurai','legendary'],['Desert Eagle','pistol','Dragon Glass','legendary'],['AWM','sniper','Genesis','arcane'],['AKR','rifle','Treasure Hunter','arcane'],['M9 Bayonet','knife','Scratch','gold'],['Karambit','knife','Gold','gold'],['Butterfly','knife','Dragon Glass','gold'],['Kunai','knife','Luck','gold'],['Flip','knife','Frozen','gold']];
const C=[{n:'Origin Case',p:40,c:'#4aa3ff',it:[0,1,2,3,4,5,6,7,9,10,13,16,18,20]},{n:'Furious Case',p:65,c:'#ff5a3c',it:[2,3,5,6,8,10,11,12,14,15,17,19,21]},{n:'Rival Case',p:180,c:'#a44bff',it:[7,8,11,12,13,14,15,16,17,18,19,22,23]},{n:'Gold Case',p:1900,c:'#ffc83d',it:[16,17,18,19,20,21,22,23,24]}];
const K='so2cs';let st=JSON.parse(localStorage.getItem(K)||'null')||{b:1000,inv:[],op:0,sp:0,best:null,kn:0,bt:0};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('ru-RU')+' G';
let cur=null,spin=false,AC;
function save(){localStorage.setItem(K,JSON.stringify(st))}
function hash(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%9973;return h}
function val(i,t){const s=S[i];let v=R[s[3]].m*(0.7+hash(s[0]+s[2])%60/100);if(t)v*=1.6;return Math.max(1,Math.round(v))}
function svg(t,c){const g='g'+t+c.slice(1);return `<svg viewBox='0 0 120 40'><defs><linearGradient id='${g}' x1='0' x2='1'><stop offset='0' stop-color='${c}'/><stop offset='1' stop-color='#ffffff'/></linearGradient></defs><path d='${SH[t]}' fill='url(#${g})' stroke='#000' stroke-width='1'/></svg>`}
function card(i,t,top,bot){const s=S[i],r=R[s[3]];return `<div class='item' style='--rc:${r.c}'>${t?`<span class='st'>ST</span>`:''}${top||''}${svg(s[1],r.c)}<div class='w'>${s[0]}</div><div class='s'>${s[2]}</div><div class='v'>${fmt(val(i,t))}</div>${bot||''}</div>`}
function chk(){$('openBtn').disabled=spin||!cur||st.b<cur.p}
function upd(){$('bal').textContent=fmt(st.b);save();chk()}
function beep(f,d,type){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=0.04;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function show(p){['cases','open','inv','stats'].forEach(x=>$('p-'+x).classList.toggle('hide',x!==p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p||(p==='open'&&b.dataset.p==='cases')));if(p==='inv')renderInv();if(p==='stats')renderStats()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(!spin)show(b.dataset.p)});
$('cases').innerHTML=C.map((c,k)=>`<div class='case' style='--cc:${c.c}' data-k='${k}'><div class='box'></div><h3>${c.n}</h3><div class='price'>${fmt(c.p)}</div></div>`).join('');
document.querySelectorAll('.case').forEach(el=>el.onclick=()=>openCase(+el.dataset.k));
function tot(c){return c.it.reduce((a,i)=>a+R[S[i][3]].w,0)}
function roll(c){let x=Math.random()*tot(c);for(const i of c.it){x-=R[S[i][3]].w;if(x<=0)return i}return c.it[c.it.length-1]}
const IW=148,WIN=48;
function fill(w){const a=[];for(let n=0;n<56;n++)a.push(n===WIN&&w?w:{i:roll(cur),t:Math.random()<.1});$('strip').innerHTML=a.map(x=>card(x.i,x.t)).join('')}
function openCase(k){cur=C[k];$('cname').textContent=cur.n;$('openBtn').textContent='Открыть за '+fmt(cur.p);const T=tot(cur),order=Object.keys(R);$('contents').innerHTML=[...cur.it].sort((a,b)=>order.indexOf(S[b][3])-order.indexOf(S[a][3])).map(i=>card(i,0,`<span class='chance'>${(R[S[i][3]].w/T*100).toFixed(2)}%</span>`)).join('');fill(null);const s=$('strip');s.style.transition='none';s.style.transform='translateX(0)';show('open');chk()}
$('back').onclick=()=>{if(!spin)show('cases')};
$('openBtn').onclick=()=>{if(spin||st.b<cur.p)return;st.b-=cur.p;st.sp+=cur.p;st.op++;upd();const w={i:roll(cur),t:Math.random()<.1};fill(w);spin=true;chk();const strip=$('strip'),W=strip.parentElement.clientWidth;const off=WIN*IW+70-W/2+(Math.random()-.5)*110;const fast=$('fast').checked,dur=fast?600:6500;strip.style.transition='none';strip.style.transform='translateX(0)';strip.offsetWidth;strip.style.transition=`transform ${dur}ms cubic-bezier(.12,.72,.1,1)`;strip.style.transform=`translateX(${-off}px)`;let last=-1;(function tk(){if(!spin)return;const x=-new DOMMatrix(getComputedStyle(strip).transform).m41;const id=Math.floor((x+W/2)/IW);if(id!==last){last=id;if(!fast)beep(1200,.03)}requestAnimationFrame(tk)})();setTimeout(()=>{spin=false;chk();win(w)},dur+150)};
function win(w){const s=S[w.i],r=R[s[3]],v=val(w.i,w.t),rk=Object.keys(R).indexOf(s[3]);const it={id:Date.now()+Math.random(),i:w.i,t:w.t};st.inv.push(it);if(s[3]==='gold')st.kn++;if(!st.best||v>val(st.best.i,st.best.t))st.best={i:w.i,t:w.t};save();for(let n=0;n<(rk>=4?3:1);n++)setTimeout(()=>beep(500+n*250+rk*80,.25,'triangle'),n*120);const m=$('win');m.style.setProperty('--rc',r.c);m.innerHTML=`<div class='r'>${r.n}${w.t?' | StatTrack':''}</div>${svg(s[1],r.c)}<div style='color:var(--m);margin-top:8px'>${s[0]}</div><h3>${s[2]}</h3><div class='v'>${fmt(v)}</div><div class='row'><button class='btn' id='wsell'>Продать</button><button class='big' id='wtake'>Забрать</button></div>`;$('modal').classList.add('on');$('wsell').onclick=()=>{sell(it.id);closeM()};$('wtake').onclick=closeM}
function closeM(){$('modal').classList.remove('on');chk()}
function sell(id){const k=st.inv.findIndex(x=>x.id===id);if(k<0)return;const x=st.inv[k];st.b+=val(x.i,x.t);st.inv.splice(k,1);upd();beep(900,.08,'sine')}
function renderInv(){const a=[...st.inv].sort((x,y)=>val(y.i,y.t)-val(x.i,x.t));const sum=a.reduce((s,x)=>s+val(x.i,x.t),0);$('invSum').textContent=a.length+' предм. на '+fmt(sum);$('inv').innerHTML=a.length?a.map(x=>card(x.i,x.t,'',`<button class='btn sell' data-id='${x.id}'>Продать</button>`)).join(''):`<div class='empty'>Инвентарь пуст. Открой кейс.</div>`;document.querySelectorAll('.sell').forEach(b=>b.onclick=()=>{sell(+b.dataset.id);renderInv()})}
$('sellAll').onclick=()=>{if(!st.inv.length||!confirm('Продать все предметы?'))return;st.inv.forEach(x=>st.b+=val(x.i,x.t));st.inv=[];upd();renderInv()};
function renderStats(){const inv=st.inv.reduce((s,x)=>s+val(x.i,x.t),0);const b=st.best?S[st.best.i]:null;$('stats').innerHTML=[['Открыто кейсов',st.op],['Потрачено',fmt(st.sp)],['Стоимость инвентаря',fmt(inv)],['Выпало ножей',st.kn],['Лучший дроп',b?b[0]+' | '+b[2]:'нет']].map(x=>`<div class='stat'><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
$('reset').onclick=()=>{if(confirm('Сбросить весь прогресс?')){localStorage.removeItem(K);location.reload()}};
const CD=180000;
function bon(){const l=CD-(Date.now()-st.bt),b=$('bonus');if(l<=0){b.disabled=false;b.textContent='Бонус +150 G'}else{b.disabled=true;const s=Math.ceil(l/1000);b.textContent='Бонус через '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}
$('bonus').onclick=()=>{if(Date.now()-st.bt<CD)return;st.b+=150;st.bt=Date.now();upd();bon();beep(700,.2,'sine')};
setInterval(bon,1000);bon();upd();
</script>
</body>
</html>
